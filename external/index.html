<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTEdu | Elite Login</title>
<link rel="stylesheet" href="/external/css/style.css">
</head>

<body class="login-page">

<div class="login-hero" style="background-image:url('https://static.vecteezy.com/system/resources/previews/042/355/046/non_2x/soccer-banner-football-banner-background-cup-template-vector.jpg');">
    <div class="dark-overlay"></div>

    <div class="login-container glass-elite">

        <h1 class="brand-title">SPORTEdu</h1>
        <p class="brand-sub">TRAIN HARD. THINK SHARP. PLAY ELITE.</p><br/><br/>

        <form id="loginForm" novalidate>

            <div class="input-wrapper">
                <label>Email Address</label>
                <input type="email" id="email" required>
                <span class="error" id="emailError"></span>
            </div>

            <br/><div class="input-wrapper">
                <label>Password</label>
                <input type="password" id="password" required>
                <span class="error" id="passwordError"></span>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember Me</label>
            </div>

            <br/><br/><button type="submit" class="btn-glow">ENTER THE PERFORMANCE ZONE</button>

        </form>

    </div>
</div>

<!-- COOKIE CONSENT -->
<div id="cookieConsent" class="cookie-consent glass-elite hidden">
    <p>
        SPORTEdu uses cookies to personalize performance experience, manage session security,
        and remember training preferences.
    </p>
    <div class="cookie-actions">
        <button id="acceptCookies" class="btn-glow small">Accept</button>
        <button id="rejectCookies" class="btn-outline small">Reject</button>
    </div>
</div>

<script src="/external/js/script.js"></script>

</body>
</html>
